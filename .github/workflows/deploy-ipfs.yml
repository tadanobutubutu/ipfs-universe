name: Deploy to IPFS via Pinata

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pinata Deploy
        id: deploy
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          # Install Pinata CLI
          curl -fsSL https://cli.pinata.cloud/install | bash
          export PATH="$HOME/.local/share/pinata:$PATH"
          
          # Auth
          pinata auth --jwt $PINATA_JWT
          
          # Upload
          # The official CLI outputs JSON by default.
          # We use --name to set the pin name.
          OUTPUT=$(pinata upload ./dist --name "ipfs-universe")
          echo "Pinata Output: $OUTPUT"
          
          CID=$(echo "$OUTPUT" | jq -r .cid)
          if [ "$CID" == "null" ] || [ -z "$CID" ]; then
            echo "Error: Failed to get CID from Pinata output"
            exit 1
          fi
          echo "cid=$CID" >> $GITHUB_OUTPUT

      - name: Update Cloudflare DNSLink
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          RECORD_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records?name=_dnslink.ipfsuniverse.xyz" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" | jq -r .result[0].id)
          
          if [ "$RECORD_ID" != "null" ] && [ "$RECORD_ID" != "" ]; then
            echo "Updating existing record $RECORD_ID"
            curl -X PATCH "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records/$RECORD_ID" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"type\":\"TXT\",\"name\":\"_dnslink\",\"content\":\"dnslink=/ipfs/${{ steps.deploy.outputs.cid }}\"}"
          else
            echo "Creating new record"
            curl -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"type\":\"TXT\",\"name\":\"_dnslink\",\"content\":\"dnslink=/ipfs/${{ steps.deploy.outputs.cid }}\",\"ttl\":1}"
          fi
