name: Verify and optionally deploy Peerstellation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Type, unit, browser, and build gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - name: Enable the Rust WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Install dependencies
        run: npm ci

      - name: Verify types, units, WASM, and production build
        run: npm run check

      - name: Verify Biome formatting and lint
        run: npm run quality

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify real-browser behavior and accessibility
        run: npm run test:e2e

      - name: Verify Pa11y and HTML validity
        run: npm run test:a11y

  deploy:
    name: Publish primary and immutable releases
    if: github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: peerstellation-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://ipfsuniverse.xyz/

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - name: Enable the Rust WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Install dependencies
        run: npm ci

      - name: Build immutable assets
        run: npm run build

      - name: Deploy the primary Cloudflare release
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
        run: npm run deploy:cloudflare

      - name: Pin the same release to public IPFS
        id: pinata
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: npm run deploy:pinata

      - name: Point DNSLink at the immutable release
        env:
          CID: ${{ steps.pinata.outputs.cid }}
          CLOUDFLARE_DNS_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: npm run deploy:dnslink
