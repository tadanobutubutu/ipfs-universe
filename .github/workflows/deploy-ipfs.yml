name: Deploy to IPFS via Pinata


on:
  push:
    branches: [main]


jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read


    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'


      - name: Install dependencies
        run: npm ci


      - name: Build
        run: npm run build


      - name: Pin to Pinata
        uses: anantaramdas/ipfs-pinata-deploy-action@v1.6.4
        id: pinata
        with:
          pinata-jwt: ${{ secrets.PINATA_JWT }}
          path: './dist'
          pin-name: 'ipfs-universe'

